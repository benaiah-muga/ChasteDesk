name: CI

on:
  push:
    branches: [main, go-migration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Generated templates
        run: go tool templ generate && test -z "$(git status --porcelain -- '*_templ.go')"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -p 1 -timeout 30m ./...
      - name: Compose configuration
        env:
          APP_SECRET: ci-secret-that-is-long-enough-for-validation-123
        run: docker compose config -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation checks
        run: node scripts/docs-check.mjs

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install console dependencies
        run: npm ci --prefix ui
      - name: Typecheck console
        run: npm --prefix ui run typecheck
      - name: Build console
        run: npm --prefix ui run build
      - name: Check committed console build
        run: git diff --exit-code -- internal/web/static/console
      - name: Check local assets
        run: node scripts/verify-ui-assets.mjs
