name: CI

on:
  push:
    branches: [main, go-migration]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chastedesk
          POSTGRES_PASSWORD: chastedesk
          POSTGRES_DB: chastedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chastedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chastedesk:chastedesk@localhost:5432/chastedesk_test
      APP_SECRET: ci-only-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
