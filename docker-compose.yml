name: chastedesk

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chastedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chastedesk}
      POSTGRES_DB: chastedesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chastedesk -d chastedesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: chastedesk-web:local
    entrypoint: ["/app/chastedesk-migrate"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://chastedesk:${POSTGRES_PASSWORD:-chastedesk}@postgres:5432/chastedesk
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: chastedesk-web:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://chastedesk:${POSTGRES_PASSWORD:-chastedesk}@postgres:5432/chastedesk
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      EMAIL_INBOUND_ADDRESS: ${EMAIL_INBOUND_ADDRESS:-}
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 4s
      start_period: 10s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: chastedesk-worker:local
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://chastedesk:${POSTGRES_PASSWORD:-chastedesk}@postgres:5432/chastedesk
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
