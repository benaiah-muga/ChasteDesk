services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chastedesk
      POSTGRES_PASSWORD: chastedesk
      POSTGRES_DB: chastedesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chastedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: chastedesk-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://chastedesk:chastedesk@postgres:5432/chastedesk
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "--import", "tsx", "packages/db/src/migrate-cli.ts"]

  web:
    image: chastedesk-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://chastedesk:chastedesk@postgres:5432/chastedesk
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: chastedesk-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://chastedesk:chastedesk@postgres:5432/chastedesk
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
